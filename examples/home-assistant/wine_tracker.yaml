# HA package: copy locally to /config/packages/wine_tracker.yaml.
# Token belongs in /config/secrets.yaml, never in action data or a chat.
# This fixed hostname is for the production app installed from justind73/ha-wine-tracker only. Do not make it
# caller-configurable: that would allow the credential to be sent elsewhere.
rest_command:
  wine_tracker_add:
    url: "http://64183197-wine-tracker:5050/api/v1/wines"
    method: post
    content_type: "application/json; charset=utf-8"
    headers:
      X-Wine-API-Key: !secret wine_tracker_api_token
      Idempotency-Key: "{{ request_id }}"
    payload: "{{ wine | to_json }}"
    timeout: 15
    verify_ssl: true

  wine_tracker_stock:
    url: >-
      http://64183197-wine-tracker:5050/api/v1/wines/{{ wine_id if wine_id is integer and wine_id > 0 else 0 }}/stock
    method: post
    content_type: "application/json; charset=utf-8"
    headers:
      X-Wine-API-Key: !secret wine_tracker_api_token
      Idempotency-Key: "{{ request_id }}"
    payload: "{{ change | to_json }}"
    timeout: 15
    verify_ssl: true

  wine_tracker_update:
    url: >-
      http://64183197-wine-tracker:5050/api/v1/wines/{{ wine_id if wine_id is integer and wine_id > 0 else 0 }}
    method: patch
    content_type: "application/json; charset=utf-8"
    headers:
      X-Wine-API-Key: !secret wine_tracker_api_token
      Idempotency-Key: "{{ request_id }}"
    payload: "{{ changes | to_json }}"
    timeout: 15
    verify_ssl: true

  wine_tracker_get:
    url: >-
      http://64183197-wine-tracker:5050/api/v1/wines/{{ wine_id if wine_id is integer and wine_id > 0 else 0 }}
    method: get
    headers:
      X-Wine-API-Key: !secret wine_tracker_api_token
    timeout: 15
    verify_ssl: true

# Required: rest_command debug logs include resolved request headers.
# Merge this with any existing logger config; do not define the same key twice.
logger:
  logs:
    homeassistant.components.rest_command: warning
