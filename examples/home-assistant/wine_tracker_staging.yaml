# HA package: copy locally to /config/packages/wine_tracker_staging.yaml.
# Token belongs in /config/secrets.yaml, never in action data or a chat.
# This fixed hostname is for the generated LOCAL app only. Do not make it
# caller-configurable: that would allow the credential to be sent elsewhere.
rest_command:
  wine_tracker_staging_add:
    url: "http://local-wine-tracker-api-staging:5050/api/v1/wines"
    method: post
    content_type: "application/json; charset=utf-8"
    headers:
      X-Wine-API-Key: !secret wine_tracker_staging_api_token
      Idempotency-Key: "{{ request_id }}"
    payload: "{{ wine | to_json }}"
    timeout: 15
    verify_ssl: true

  wine_tracker_staging_stock:
    url: >-
      http://local-wine-tracker-api-staging:5050/api/v1/wines/{{ wine_id if wine_id is integer and wine_id > 0 else 0 }}/stock
    method: post
    content_type: "application/json; charset=utf-8"
    headers:
      X-Wine-API-Key: !secret wine_tracker_staging_api_token
      Idempotency-Key: "{{ request_id }}"
    payload: "{{ change | to_json }}"
    timeout: 15
    verify_ssl: true

  wine_tracker_staging_update:
    url: >-
      http://local-wine-tracker-api-staging:5050/api/v1/wines/{{ wine_id if wine_id is integer and wine_id > 0 else 0 }}
    method: patch
    content_type: "application/json; charset=utf-8"
    headers:
      X-Wine-API-Key: !secret wine_tracker_staging_api_token
      Idempotency-Key: "{{ request_id }}"
    payload: "{{ changes | to_json }}"
    timeout: 15
    verify_ssl: true

  wine_tracker_staging_get:
    url: >-
      http://local-wine-tracker-api-staging:5050/api/v1/wines/{{ wine_id if wine_id is integer and wine_id > 0 else 0 }}
    method: get
    headers:
      X-Wine-API-Key: !secret wine_tracker_staging_api_token
    timeout: 15
    verify_ssl: true

# Required: rest_command debug logs include resolved request headers.
# Merge this with any existing logger config; do not define the same key twice.
logger:
  logs:
    homeassistant.components.rest_command: warning
